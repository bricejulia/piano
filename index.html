<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<!-- Added to the home screen, it opens full screen like an app. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Piano</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #111; }
  body {
    display: flex;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .tile {
    flex: 1;
    height: 100vh;
    height: 100dvh;
    background: var(--c);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 8vh;
    gap: 0.6rem;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.95);
    transition: filter 0.25s ease, transform 0.25s ease;
  }
  .tile.active {
    filter: brightness(1.25) saturate(1.1);
    transform: scaleY(0.985);
    transform-origin: top;
    transition: filter 0.03s, transform 0.03s;
  }
  .note {
    font-size: clamp(1rem, 4vw, 2.6rem);
    font-weight: 300;
    letter-spacing: 0.05em;
    text-transform: lowercase;
  }
  .key {
    font-size: clamp(0.65rem, 1.2vw, 0.85rem);
    font-weight: 500;
    opacity: 0.55;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Control bar: three pills (metronome, song, instrument) that wrap as whole groups. */
  .metro {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    right: max(16px, env(safe-area-inset-right));
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    pointer-events: none;
    z-index: 10;
  }
  .group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    font-size: 16px; /* 16px+ stops iOS from zooming in when a menu is tapped */
    pointer-events: auto;
  }
  /* 44px touch targets, the size Apple and Google recommend for fingers. */
  .metro button,
  .metro select {
    background: none;
    border: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    min-width: 44px;
    height: 44px;
    border-radius: 999px;
    opacity: 0.85;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .metro select { padding: 0 12px; }
  .metro select option { background: #222; color: #fff; }
  .metro button:active { background: rgba(255, 255, 255, 0.2); }
  @media (hover: hover) {
    .metro button:hover, .metro select:hover { opacity: 1; background: rgba(255, 255, 255, 0.12); }
  }
  .metro .play, .metro .minus, .metro .plus { font-size: 20px; }
  .metro .bpm {
    font-variant-numeric: tabular-nums;
    min-width: 4.6rem;
    text-align: center;
  }
  .metro .bpm small { opacity: 0.55; font-size: 12px; margin-left: 3px; }
  .dots { display: flex; gap: 6px; padding: 0 6px; }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    transition: background 0.15s, transform 0.15s;
  }
  .dot.on { background: #fff; transform: scale(1.3); transition: none; }
  .dot.accent.on { background: #fff; transform: scale(1.6); }
  .metro .listen, .metro .practice { padding: 0 14px; }
  .metro .on { background: rgba(255, 255, 255, 0.22); opacity: 1; }
  .metro .fullscreen { font-size: 20px; }
  /* Touch devices go full screen on every tap, so the button is only for computers. */
  @media (pointer: coarse) { .metro .fullscreen { display: none; } }
  .timeline { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .score {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    padding: 1.2rem 2rem;
    border-radius: 1.2rem;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 20;
  }
  .score.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .score b { font-size: 2rem; font-weight: 600; }
  .score span { font-size: 1rem; opacity: 0.85; }
  .labeled .note { font-size: clamp(0.7rem, 1.8vw, 1.3rem); text-align: center; padding: 0 0.3rem; line-height: 1.3; }
  .note .emoji { display: block; font-size: 2.4em; line-height: 1.2; }

  /* Touch screens: no keyboard hints. */
  @media (any-pointer: coarse) { .key { display: none; } }
  /* Tablets (touch + tall enough): much bigger controls for small fingers. Phones keep 44px. */
  @media (any-pointer: coarse) and (min-height: 500px) {
    .metro { gap: 12px; }
    .group { gap: 8px; padding: 8px 12px; font-size: 22px; }
    .metro button, .metro select { min-width: 64px; height: 64px; }
    .metro select { padding: 0 18px; }
    .metro .play, .metro .minus, .metro .plus { font-size: 28px; }
    .metro .bpm { min-width: 6rem; }
    .metro .bpm small { font-size: 15px; }
    .metro .listen, .metro .practice { padding: 0 20px; }
    .dots { gap: 9px; padding: 0 8px; }
    .dot { width: 13px; height: 13px; }
    .note { font-size: clamp(1.4rem, 4.5vw, 3.2rem); }
    .labeled .note { font-size: clamp(0.9rem, 2.2vw, 1.6rem); }
    .score b { font-size: 3rem; }
    .score span { font-size: 1.4rem; }
  }
</style>
</head>
<body>
<div class="metro">
  <div class="group">
    <button class="play" title="Start / stop (space)">▶</button>
    <button class="minus" title="Slower (↓)">−</button>
    <span class="bpm"><span class="bpm-val">90</span><small>bpm</small></span>
    <button class="plus" title="Faster (↑)">+</button>
    <div class="dots"></div>
    <button class="sig" title="Beats per bar">4/4</button>
  </div>
  <div class="group">
    <select class="song" title="Chanson"></select>
    <button class="listen" title="Écouter la chanson (Esc pour arrêter)">♪ écouter</button>
    <button class="practice" title="Jouer la chanson en rythme (Esc pour arrêter)">★ jouer</button>
  </div>
  <div class="group">
    <select class="instrument" title="Instrument"></select>
    <button class="fullscreen" title="Plein écran">⛶</button>
  </div>
</div>
<canvas class="timeline" hidden></canvas>
<div class="score"></div>
<script>
  const NOTES = [
    { name: "do",  key: "a", freq: 261.63, color: "#e5484d" },
    { name: "ré",  key: "s", freq: 293.66, color: "#f76b15" },
    { name: "mi",  key: "d", freq: 329.63, color: "#ffc53d" },
    { name: "fa",  key: "f", freq: 349.23, color: "#46a758" },
    { name: "sol", key: "g", freq: 392.00, color: "#12a594" },
    { name: "la",  key: "h", freq: 440.00, color: "#0090ff" },
    { name: "si",  key: "j", freq: 493.88, color: "#6e56cf" },
    { name: "do",  key: "k", freq: 523.25, color: "#d6409f" },
  ];

  let ctx, master, noise;
  function audio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      // A light compressor keeps chords and drum hits from clipping.
      master = ctx.createDynamicsCompressor();
      master.connect(ctx.destination);
      noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  // Envelope gain node: quick attack to `peak`, exponential fade to silence at `end`.
  function env(ac, t, peak, attack, end) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, end);
    g.connect(master);
    return g;
  }

  function noiseSource(ac, t, dur) {
    const src = ac.createBufferSource();
    src.buffer = noise;
    src.start(t);
    src.stop(t + dur);
    return src;
  }

  function filter(ac, type, freq, q = 1) {
    const f = ac.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    f.Q.value = q;
    return f;
  }

  // Soft piano-like tone: a few harmonics with a quick attack and exponential decay.
  function piano(ac, freq, t) {
    const out = env(ac, t, 0.35, 0.005, t + 1.8);
    [[1, 1, "triangle"], [2, 0.3, "sine"], [3, 0.12, "sine"]].forEach(([mult, amp, type]) => {
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = type;
      osc.frequency.value = freq * mult;
      g.gain.value = amp;
      osc.connect(g).connect(out);
      osc.start(t);
      osc.stop(t + 1.9);
    });
  }

  // Plucked string (Karplus–Strong): a burst of noise fed through a decaying delay line.
  const guitarCache = {};
  function guitar(ac, freq, t) {
    if (!guitarCache[freq]) {
      const sr = ac.sampleRate;
      const buf = ac.createBuffer(1, sr * 2.5, sr);
      const y = buf.getChannelData(0);
      const n = Math.round(sr / freq - 0.5);
      for (let i = 0; i < n; i++) y[i] = Math.random() * 2 - 1;
      for (let i = n; i < y.length; i++) y[i] = 0.996 * 0.5 * (y[i - n] + (i > n ? y[i - n - 1] : 0));
      guitarCache[freq] = buf;
    }
    const src = ac.createBufferSource();
    src.buffer = guitarCache[freq];
    src.connect(filter(ac, "lowpass", 3500)).connect(env(ac, t, 0.5, 0.003, t + 2.4));
    src.start(t);
  }

  // Flute: near-sine tone with gentle vibrato and a breathy noise layer.
  function flute(ac, freq, t, dur) {
    const end = t + Math.max(dur, 0.15) + 0.15;
    const out = ac.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(0.3, t + 0.06);
    out.gain.setValueAtTime(0.3, end - 0.15);
    out.gain.exponentialRampToValueAtTime(0.0001, end);
    out.connect(master);

    const osc = ac.createOscillator();
    osc.type = "sine";
    osc.frequency.value = freq;
    const lfo = ac.createOscillator();
    const depth = ac.createGain();
    lfo.frequency.value = 5;
    depth.gain.setValueAtTime(0, t);
    depth.gain.linearRampToValueAtTime(freq * 0.006, t + 0.3);
    lfo.connect(depth).connect(osc.frequency);
    const h2 = ac.createOscillator();
    const h2g = ac.createGain();
    h2.frequency.value = freq * 2;
    h2g.gain.value = 0.08;
    osc.connect(out);
    h2.connect(h2g).connect(out);

    const breath = ac.createGain();
    breath.gain.value = 0.05;
    noiseSource(ac, t, end - t).connect(filter(ac, "bandpass", freq * 2, 2)).connect(breath).connect(out);

    [osc, lfo, h2].forEach((o) => { o.start(t); o.stop(end); });
  }

  // Drum kit: each tile is a different drum, synthesized from oscillators and noise.
  function drum(ac, i, t) {
    const tone = (from, to, decay, peak) => {
      const osc = ac.createOscillator();
      osc.frequency.setValueAtTime(from, t);
      osc.frequency.exponentialRampToValueAtTime(to, t + decay * 0.5);
      osc.connect(env(ac, t, peak, 0.002, t + decay));
      osc.start(t);
      osc.stop(t + decay);
    };
    const hiss = (type, freq, decay, peak, q) =>
      noiseSource(ac, t, decay).connect(filter(ac, type, freq, q)).connect(env(ac, t, peak, 0.002, t + decay));

    switch (i) {
      case 0: tone(150, 40, 0.45, 1); break;                                   // grosse caisse
      case 1: hiss("highpass", 1200, 0.2, 0.6); tone(200, 160, 0.12, 0.4); break; // caisse claire
      case 2: hiss("highpass", 7500, 0.05, 0.35); break;                       // charley fermé
      case 3: hiss("highpass", 7000, 0.35, 0.3); break;                        // charley ouvert
      case 4: tone(120, 75, 0.45, 0.8); break;                                 // tom grave
      case 5: tone(220, 150, 0.35, 0.7); break;                                // tom aigu
      case 6:                                                                  // clap
        [0, 0.01, 0.02].forEach((o) =>
          noiseSource(ac, t + o, 0.02).connect(filter(ac, "bandpass", 1500, 1.5)).connect(env(ac, t + o, 0.5, 0.001, t + o + 0.02))
        );
        hiss("bandpass", 1500, 0.2, 0.4, 1.5);
        break;
      case 7: hiss("highpass", 5000, 1.6, 0.3); break;                         // cymbale
    }
  }

  // Envelope for held notes: attack, hold for `dur`, short release. Returns the output node and end time.
  function held(ac, t, dur, peak, attack) {
    const end = t + Math.max(dur, 0.2) + 0.15;
    const out = ac.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(peak, t + attack);
    out.gain.setValueAtTime(peak, end - 0.15);
    out.gain.exponentialRampToValueAtTime(0.0001, end);
    out.connect(master);
    return { out, end };
  }

  // Wobble an oscillator's pitch by `depth` Hz, fading in over `delay` seconds.
  function vibrato(ac, osc, t, end, rate, depth, delay) {
    const lfo = ac.createOscillator();
    const g = ac.createGain();
    lfo.frequency.value = rate;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(depth, t + delay);
    lfo.connect(g).connect(osc.frequency);
    lfo.start(t);
    lfo.stop(end);
  }

  // Sine partials as [frequency multiplier, peak, decay seconds].
  function partials(ac, freq, t, list, attack = 0.002) {
    list.forEach(([mult, peak, decay]) => {
      const osc = ac.createOscillator();
      osc.frequency.value = freq * mult;
      osc.connect(env(ac, t, peak, attack, t + decay));
      osc.start(t);
      osc.stop(t + decay);
    });
  }

  // Xylophone: a wooden bar hit by a mallet, short and bright, with a little click.
  function xylophone(ac, freq, t) {
    partials(ac, freq * 2, t, [[1, 0.45, 0.5], [3, 0.12, 0.1]]);
    noiseSource(ac, t, 0.01).connect(filter(ac, "highpass", 3000)).connect(env(ac, t, 0.12, 0.001, t + 0.01));
  }

  // Music box: tiny high bells, two slightly detuned for shimmer, ringing a long time.
  function musicBox(ac, freq, t) {
    partials(ac, freq * 2, t, [[1, 0.25, 2.5], [1.003, 0.12, 2.2], [5.4, 0.03, 0.2]]);
  }

  // Violin: bowed string, slow attack, warm tone with vibrato, held for the note's length.
  function violin(ac, freq, t, dur) {
    const { out, end } = held(ac, t, dur, 0.2, 0.12);
    const osc = ac.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.value = freq;
    vibrato(ac, osc, t, end, 5.5, freq * 0.007, 0.3);
    osc.connect(filter(ac, "lowpass", 2500, 0.7)).connect(out);
    osc.start(t);
    osc.stop(end);
  }

  // Trumpet: brassy tone that opens up bright, starts a touch flat, held for the note's length.
  function trumpet(ac, freq, t, dur) {
    const { out, end } = held(ac, t, dur, 0.18, 0.03);
    const osc = ac.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(freq * 0.97, t);
    osc.frequency.exponentialRampToValueAtTime(freq, t + 0.05);
    vibrato(ac, osc, t, end, 5, freq * 0.004, 0.35);
    const f = filter(ac, "lowpass", 800, 2);
    f.frequency.setValueAtTime(800, t);
    f.frequency.exponentialRampToValueAtTime(3000, t + 0.05);
    f.frequency.exponentialRampToValueAtTime(2000, t + 0.3);
    osc.connect(f).connect(out);
    osc.start(t);
    osc.stop(end);
  }

  // Animals: each tile is a silly synthesized animal noise.
  function animal(ac, i, t) {
    // One sound: an oscillator gliding through [offset, Hz] points, through a chain of nodes.
    const voice = (type, start, dur, glide, peak, chain = []) => {
      const osc = ac.createOscillator();
      const t0 = t + start;
      osc.type = type;
      osc.frequency.setValueAtTime(glide[0][1], t0);
      glide.slice(1).forEach(([o, f]) => osc.frequency.exponentialRampToValueAtTime(f, t0 + o));
      [osc, ...chain].reduce((a, b) => a.connect(b)).connect(env(ac, t0, peak, 0.02, t0 + dur));
      osc.start(t0);
      osc.stop(t0 + dur);
      return osc;
    };
    // Pulses the volume `rate` times per second (croak, bleat).
    const tremolo = (rate, dur) => {
      const am = ac.createGain();
      const lfo = ac.createOscillator();
      const depth = ac.createGain();
      am.gain.value = 0.5;
      depth.gain.value = 0.5;
      lfo.type = "square";
      lfo.frequency.value = rate;
      lfo.connect(depth).connect(am.gain);
      lfo.start(t);
      lfo.stop(t + dur);
      return am;
    };

    switch (i) {
      case 0: // oiseau: three quick chirps
        [0, 0.12, 0.24].forEach((o) => voice("sine", o, 0.09, [[0, 2500], [0.07, 4200]], 0.25));
        break;
      case 1: // chat: "miaou"
        voice("sawtooth", 0, 0.7, [[0, 450], [0.25, 800], [0.7, 420]], 0.3, [filter(ac, "bandpass", 1200, 1.5)]);
        break;
      case 2: // chien: "wouf wouf"
        [0, 0.22].forEach((o) => voice("sawtooth", o, 0.14, [[0, 380], [0.14, 180]], 0.5, [filter(ac, "lowpass", 1400)]));
        break;
      case 3: { // vache: "meuh"
        const f = filter(ac, "lowpass", 300);
        f.frequency.setValueAtTime(300, t);
        f.frequency.linearRampToValueAtTime(1200, t + 0.4);
        f.frequency.linearRampToValueAtTime(400, t + 1.1);
        voice("sawtooth", 0, 1.1, [[0, 150], [0.3, 165], [1.1, 110]], 0.45, [f]);
        break;
      }
      case 4: // canard: "coin coin"
        [0, 0.2].forEach((o) => voice("square", o, 0.13, [[0, 700], [0.13, 500]], 0.2, [filter(ac, "bandpass", 1300, 4)]));
        break;
      case 5: // grenouille: "croâ croâ"
        [0, 0.35].forEach((o) =>
          voice("square", o, 0.22, [[0, 140], [0.22, 110]], 0.3, [filter(ac, "lowpass", 900), tremolo(28, 0.6)])
        );
        break;
      case 6: // mouton: "bêê"
        voice("sawtooth", 0, 0.8, [[0, 380], [0.8, 340]], 0.3, [filter(ac, "bandpass", 1000), tremolo(7, 0.8)]);
        break;
      case 7: { // abeille: "bzzz"
        const osc = voice("sawtooth", 0, 1, [[0, 210], [1, 230]], 0.15, [filter(ac, "lowpass", 1500)]);
        vibrato(ac, osc, t, t + 1, 12, 15, 0.01);
        break;
      }
    }
  }

  // Each instrument plays tile `i` (frequency `f`) at time `t`; held ones use the note length `d`.
  // Instruments with `labels` show those on the tiles instead of the note names.
  const INSTRUMENTS = {
    piano:     { label: "piano",           play: (ac, i, f, t) => piano(ac, f, t) },
    guitare:   { label: "guitare",         play: (ac, i, f, t) => guitar(ac, f, t) },
    flute:     { label: "flûte",           play: (ac, i, f, t, d) => flute(ac, f, t, d) },
    violon:    { label: "violon",          play: (ac, i, f, t, d) => violin(ac, f, t, d) },
    trompette: { label: "trompette",       play: (ac, i, f, t, d) => trumpet(ac, f, t, d) },
    xylophone: { label: "xylophone",       play: (ac, i, f, t) => xylophone(ac, f, t) },
    boite:     { label: "boîte à musique", play: (ac, i, f, t) => musicBox(ac, f, t) },
    batterie: {
      label: "batterie",
      play: (ac, i, f, t) => drum(ac, i, t),
      labels: ["grosse caisse", "caisse claire", "charley", "charley ouvert", "tom grave", "tom aigu", "clap", "cymbale"],
    },
    animaux: {
      label: "animaux",
      play: (ac, i, f, t) => animal(ac, i, t),
      labels: ["🐦\noiseau", "🐱\nchat", "🐶\nchien", "🐮\nvache", "🦆\ncanard", "🐸\ngrenouille", "🐑\nmouton", "🐝\nabeille"],
    },
  };
  let instrument = "piano";

  // Play tile `i` with the current instrument, now or at audio time `when`.
  function play(i, when, dur = 0.6) {
    const ac = audio();
    INSTRUMENTS[instrument].play(ac, i, NOTES[i].freq, when ?? ac.currentTime, dur);
  }

  const tiles = NOTES.map((n, i) => {
    const el = document.createElement("div");
    el.className = "tile";
    el.style.setProperty("--c", n.color);
    el.innerHTML = `<span class="note">${n.name}</span><span class="key">${n.key} · ${i + 1}</span>`;
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      trigger(i);
    });
    el.addEventListener("pointerup", () => el.classList.remove("active"));
    el.addEventListener("pointerleave", () => el.classList.remove("active"));
    document.body.appendChild(el);
    return el;
  });

  function trigger(i) {
    play(i);
    tiles[i].classList.add("active");
    judge(i);
  }

  function setInstrument(name) {
    instrument = name;
    const labels = INSTRUMENTS[name].labels;
    document.body.classList.toggle("labeled", !!labels);
    tiles.forEach((el, i) => {
      const note = el.querySelector(".note");
      const [emoji, text] = labels?.[i].includes("\n") ? labels[i].split("\n") : [null, labels?.[i] ?? NOTES[i].name];
      note.textContent = text;
      if (emoji) note.insertAdjacentHTML("afterbegin", `<span class="emoji">${emoji}</span>`);
    });
  }

  // Letters (A–K) and numbers (1–8, top row or numpad) both play the notes.
  const byKey = {};
  NOTES.forEach((n, i) => {
    byKey[n.key] = i;
    byKey[String(i + 1)] = i;
  });
  window.addEventListener("keydown", (e) => {
    const i = byKey[e.key.toLowerCase()];
    if (i === undefined || e.repeat) return;
    trigger(i);
  });
  window.addEventListener("keyup", (e) => {
    const i = byKey[e.key.toLowerCase()];
    if (i !== undefined) tiles[i].classList.remove("active");
  });

  // ---- Metronome ----
  // Clicks are scheduled ahead on the audio clock for steady timing;
  // the dots follow the same clock via requestAnimationFrame.
  const metro = {
    bpm: 90,
    beats: 4,
    running: false,
    nextTime: 0,
    beat: 0,
    timer: null,
    queue: [],
  };
  const SIGS = [2, 3, 4, 6];
  const $ = (s) => document.querySelector(s);
  const playBtn = $(".metro .play");
  const bpmVal = $(".metro .bpm-val");
  const sigBtn = $(".metro .sig");
  const dotsEl = $(".dots");

  function renderDots() {
    dotsEl.innerHTML = "";
    for (let i = 0; i < metro.beats; i++) {
      const d = document.createElement("span");
      d.className = "dot" + (i === 0 ? " accent" : "");
      dotsEl.appendChild(d);
    }
  }

  function click(time, accent) {
    const ac = audio();
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = "sine";
    osc.frequency.value = accent ? 1500 : 1000;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(accent ? 0.4 : 0.25, time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
    osc.connect(g).connect(ac.destination);
    osc.start(time);
    osc.stop(time + 0.06);
  }

  function schedule() {
    const ac = audio();
    while (metro.nextTime < ac.currentTime + 0.1) {
      click(metro.nextTime, metro.beat === 0);
      metro.queue.push({ beat: metro.beat, time: metro.nextTime });
      metro.nextTime += 60 / metro.bpm;
      metro.beat = (metro.beat + 1) % metro.beats;
    }
  }

  function draw() {
    if (!metro.running) return;
    const now = ctx.currentTime;
    let current = null;
    while (metro.queue.length && metro.queue[0].time <= now) {
      current = metro.queue.shift();
    }
    if (current) {
      [...dotsEl.children].forEach((d, i) => d.classList.toggle("on", i === current.beat));
      setTimeout(() => dotsEl.children[current.beat]?.classList.remove("on"), 100);
    }
    requestAnimationFrame(draw);
  }

  function start(at) {
    const ac = audio();
    metro.running = true;
    metro.beat = 0;
    metro.queue = [];
    metro.nextTime = at ?? ac.currentTime + 0.05;
    schedule();
    metro.timer = setInterval(schedule, 25);
    playBtn.textContent = "■";
    requestAnimationFrame(draw);
  }

  function stop() {
    metro.running = false;
    clearInterval(metro.timer);
    playBtn.textContent = "▶";
    [...dotsEl.children].forEach((d) => d.classList.remove("on"));
  }

  function setBpm(v) {
    metro.bpm = Math.max(30, Math.min(240, v));
    bpmVal.textContent = metro.bpm;
    retime();
  }

  playBtn.addEventListener("click", () => (metro.running ? stop() : start()));  $(".metro .minus").addEventListener("click", () => setBpm(metro.bpm - 5));
  $(".metro .plus").addEventListener("click", () => setBpm(metro.bpm + 5));
  sigBtn.addEventListener("click", () => {
    metro.beats = SIGS[(SIGS.indexOf(metro.beats) + 1) % SIGS.length];
    sigBtn.textContent = `${metro.beats}/4`;
    renderDots();
    if (metro.running) { stop(); start(); }
  });
  // Keep buttons from stealing focus so space never re-clicks them.
  document.querySelectorAll(".metro button").forEach((b) =>
    b.addEventListener("mousedown", (e) => e.preventDefault())
  );

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      if (!e.repeat) metro.running ? stop() : start();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      setBpm(metro.bpm + (e.shiftKey ? 1 : 5));
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      setBpm(metro.bpm - (e.shiftKey ? 1 : 5));
    }
  });

  renderDots();

  // ---- Demo songs ----
  // Each note is "name:beats"; DO is the high do, "-" is a rest.
  const SONGS = [
    {
      title: "Vive le vent",
      bpm: 160,
      notes:
        "mi:1 mi:1 mi:2 mi:1 mi:1 mi:2 mi:1 sol:1 do:1.5 re:.5 mi:4 " +
        "fa:1 fa:1 fa:1.5 fa:.5 fa:1 mi:1 mi:1 mi:.5 mi:.5 mi:1 re:1 re:1 mi:1 re:2 sol:2 " +
        "mi:1 mi:1 mi:2 mi:1 mi:1 mi:2 mi:1 sol:1 do:1.5 re:.5 mi:4 " +
        "fa:1 fa:1 fa:1.5 fa:.5 fa:1 mi:1 mi:1 mi:.5 mi:.5 sol:1 sol:1 fa:1 re:1 do:4",
    },
    {
      title: "Au clair de la lune",
      bpm: 110,
      notes:
        "do:1 do:1 do:1 re:1 mi:2 re:2 do:1 mi:1 re:1 re:1 do:4 " +
        "do:1 do:1 do:1 re:1 mi:2 re:2 do:1 mi:1 re:1 re:1 do:4",
    },
    {
      title: "Ah ! vous dirai-je, maman",
      bpm: 110,
      notes:
        "do:1 do:1 sol:1 sol:1 la:1 la:1 sol:2 fa:1 fa:1 mi:1 mi:1 re:1 re:1 do:2 " +
        "sol:1 sol:1 fa:1 fa:1 mi:1 mi:1 re:2 sol:1 sol:1 fa:1 fa:1 mi:1 mi:1 re:2 " +
        "do:1 do:1 sol:1 sol:1 la:1 la:1 sol:2 fa:1 fa:1 mi:1 mi:1 re:1 re:1 do:2",
    },
    {
      title: "Ode à la joie",
      bpm: 120,
      notes:
        "mi:1 mi:1 fa:1 sol:1 sol:1 fa:1 mi:1 re:1 do:1 do:1 re:1 mi:1 mi:1.5 re:.5 re:2 " +
        "mi:1 mi:1 fa:1 sol:1 sol:1 fa:1 mi:1 re:1 do:1 do:1 re:1 mi:1 re:1.5 do:.5 do:2",
    },
  ];
  const INDEX = { do: 0, re: 1, mi: 2, fa: 3, sol: 4, la: 5, si: 6, DO: 7, "-": -1 };
  SONGS.forEach((s) => {
    let beat = 0;
    s.seq = s.notes.split(/\s+/).map((t) => {
      const [n, d] = t.split(":");
      const note = { i: INDEX[n], beats: parseFloat(d), start: beat };
      beat += note.beats;
      return note;
    });
    s.length = beat;
  });

  // ---- Song player ----
  // "écouter" plays the song by itself; "jouer" lets her play it.
  // Both show a timeline: notes fall down their tile's column and should be
  // played when they reach the line. A block's length is the note's length.
  const songSel = $(".metro .song");
  const listenBtn = $(".metro .listen");
  const practiceBtn = $(".metro .practice");
  const scoreEl = $(".score");
  const canvas = $(".timeline");
  const g = canvas.getContext("2d");
  SONGS.forEach((s, i) => songSel.add(new Option(s.title, i)));

  const LOOKAHEAD = 4;   // beats visible above the line
  const WINDOW = 0.2;    // seconds early/late that still count as a hit
  const PERFECT = 0.08;

  // Position in the song is tracked in beats, anchored to the audio clock,
  // so changing the tempo mid-song keeps everything in place.
  const song = { mode: null, notes: [], end: 0, idx: 0, bpm: 90, anchorTime: 0, anchorBeat: 0,
                 timer: null, timeouts: [], ownMetro: false, score: 0, popups: [] };
  const beatAt = (t) => song.anchorBeat + ((t - song.anchorTime) * song.bpm) / 60;
  const timeAt = (b) => song.anchorTime + ((b - song.anchorBeat) * 60) / song.bpm;

  function retime() {
    if (!song.mode) return;
    const now = ctx.currentTime;
    song.anchorBeat = beatAt(now);
    song.anchorTime = now;
    song.bpm = metro.bpm;
  }

  // Light up a tile in sync with a note scheduled on the audio clock.
  function flash(i, when, dur) {
    const delay = Math.max(0, (when - ctx.currentTime) * 1000);
    song.timeouts.push(
      setTimeout(() => tiles[i].classList.add("active"), delay),
      setTimeout(() => tiles[i].classList.remove("active"), delay + dur * 1000 * 0.8)
    );
  }

  function songTick() {
    const now = ctx.currentTime;
    if (song.mode === "listen") {
      while (song.idx < song.notes.length && timeAt(song.notes[song.idx].start) < now + 0.1) {
        const n = song.notes[song.idx++];
        const t = timeAt(n.start);
        const dur = (n.beats * 60) / song.bpm;
        play(n.i, t, dur * 0.9);
        flash(n.i, t, dur);
      }
    }
    if (beatAt(now) > song.end + 1) stopSong(true);
  }

  // Called on every tile press: in practice mode, match it to the closest note.
  function judge(i) {
    if (song.mode !== "practice") return;
    const now = ctx.currentTime;
    let best = null;
    let bestDt = Infinity;
    for (const n of song.notes) {
      if (n.i !== i || n.hit || n.missed) continue;
      const dt = Math.abs(timeAt(n.start) - now);
      if (dt < bestDt) { best = n; bestDt = dt; }
    }
    if (best && bestDt <= WINDOW) {
      best.hit = true;
      song.score++;
      song.popups.push({ i, text: bestDt <= PERFECT ? "parfait !" : "bien", t: now });
    }
  }

  function draw() {
    if (!song.mode) return;
    const W = innerWidth;
    const H = innerHeight;
    const dpr = devicePixelRatio || 1;
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
    }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);

    const now = ctx.currentTime;
    const beat = beatAt(now);
    // Notes fall from just under the control bar (which may wrap to two rows) to the line.
    const topY = $(".metro").getBoundingClientRect().bottom + 8;
    const hitY = Math.max(H * 0.62, topY + 120);
    const ppb = (hitY - topY) / LOOKAHEAD;
    const col = W / NOTES.length;

    if (song.mode === "practice") {
      for (const n of song.notes) {
        if (!n.hit && !n.missed && now - timeAt(n.start) > WINDOW) n.missed = true;
      }
    }

    g.save();
    g.beginPath();
    g.rect(0, topY, W, hitY - topY);
    g.clip();

    // Faint bar lines help read the rhythm.
    g.fillStyle = "rgba(255, 255, 255, 0.18)";
    const first = Math.ceil(beat / metro.beats) * metro.beats;
    for (let b = first; b < beat + LOOKAHEAD; b += metro.beats) {
      g.fillRect(0, hitY - (b - beat) * ppb, W, 1);
    }

    for (const n of song.notes) {
      const bottom = hitY - (n.start - beat) * ppb;
      const top = bottom - n.beats * ppb + 4;
      if (bottom < topY || top > hitY) continue;
      const x = n.i * col + col * 0.18;
      const w = col * 0.64;
      g.fillStyle = n.missed ? "rgba(255, 255, 255, 0.3)" : "rgba(255, 255, 255, 0.9)";
      g.shadowColor = "rgba(255, 255, 255, 0.9)";
      g.shadowBlur = n.hit ? 18 : 0;
      g.beginPath();
      if (g.roundRect) g.roundRect(x, top, w, bottom - top, 8);
      else g.rect(x, top, w, bottom - top);
      g.fill();
    }
    g.restore();

    g.fillStyle = "rgba(255, 255, 255, 0.8)";
    g.fillRect(0, hitY - 1, W, 2);

    // "parfait !" / "bien" pop just under the line, on the tile's color, and fade.
    g.textAlign = "center";
    g.font = "600 16px -apple-system, BlinkMacSystemFont, sans-serif";
    g.shadowColor = "rgba(0, 0, 0, 0.35)";
    g.shadowBlur = 4;
    song.popups = song.popups.filter((p) => now - p.t < 0.8);
    for (const p of song.popups) {
      const age = (now - p.t) / 0.8;
      g.fillStyle = `rgba(255, 255, 255, ${1 - age})`;
      g.fillText(p.text, (p.i + 0.5) * col, hitY + 36 + age * 16);
    }
    g.shadowBlur = 0;

    requestAnimationFrame(draw);
  }

  function setButtons() {
    listenBtn.classList.toggle("on", song.mode === "listen");
    practiceBtn.classList.toggle("on", song.mode === "practice");
    listenBtn.textContent = song.mode === "listen" ? "■ stop" : "♪ écouter";
    practiceBtn.textContent = song.mode === "practice" ? "■ stop" : "★ jouer";
  }

  function startSong(mode) {
    stopSong();
    const ac = audio();
    const data = SONGS[songSel.value];
    song.mode = mode;
    song.notes = data.seq.filter((n) => n.i >= 0).map((n) => ({ ...n }));
    song.end = data.length;
    song.idx = 0;
    song.score = 0;
    song.popups = [];
    song.bpm = metro.bpm;
    // One bar of count-in so the first notes can be seen coming.
    song.anchorBeat = -metro.beats;
    song.anchorTime = ac.currentTime + 0.1;
    // The metronome counts in and keeps time; it always plays in practice mode.
    if (metro.running) { stop(); start(song.anchorTime); }
    else if (mode === "practice") { start(song.anchorTime); song.ownMetro = true; }
    scoreEl.classList.remove("show");
    canvas.hidden = false;
    song.timer = setInterval(songTick, 25);
    songTick();
    setButtons();
    requestAnimationFrame(draw);
  }

  function stopSong(finished) {
    if (!song.mode) return;
    const wasPractice = song.mode === "practice";
    song.mode = null;
    clearInterval(song.timer);
    song.timeouts.forEach(clearTimeout);
    song.timeouts = [];
    tiles.forEach((t) => t.classList.remove("active"));
    if (song.ownMetro) { stop(); song.ownMetro = false; }
    g.clearRect(0, 0, canvas.width, canvas.height);
    canvas.hidden = true;
    setButtons();
    if (finished && wasPractice) showScore();
  }

  function showScore() {
    const total = song.notes.length;
    const ratio = song.score / total;
    const msg = ratio >= 0.9 ? "Bravo !" : ratio >= 0.6 ? "Très bien !" : "Continue !";
    scoreEl.innerHTML = `<b>★ ${song.score} / ${total}</b><span>${msg}</span>`;
    scoreEl.classList.add("show");
    clearTimeout(showScore.t);
    showScore.t = setTimeout(() => scoreEl.classList.remove("show"), 4000);
  }

  songSel.addEventListener("change", () => {
    setBpm(SONGS[songSel.value].bpm);
    if (song.mode) startSong(song.mode);
    songSel.blur();
  });
  listenBtn.addEventListener("click", () => (song.mode === "listen" ? stopSong() : startSong("listen")));
  practiceBtn.addEventListener("click", () => (song.mode === "practice" ? stopSong() : startSong("practice")));
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") stopSong();
  });

  setBpm(SONGS[0].bpm);

  const instSel = $(".metro .instrument");
  Object.entries(INSTRUMENTS).forEach(([k, v]) => instSel.add(new Option(v.label, k)));
  instSel.addEventListener("change", () => {
    setInstrument(instSel.value);
    instSel.blur();
  });

  // ---- Full screen ----
  // Browsers only allow full screen right after a tap or key press, so on
  // touch devices every tap puts it back if it was left.
  const fsBtn = $(".metro .fullscreen");
  const root = document.documentElement;
  const canFull = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

  function enterFull() {
    if (!canFull || isFull()) return;
    const req = root.requestFullscreen
      ? root.requestFullscreen({ navigationUI: "hide" })
      : root.webkitRequestFullscreen();
    Promise.resolve(req)
      .then(() => screen.orientation?.lock?.("landscape"))
      .catch(() => {});
  }

  function exitFull() {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }

  if (!canFull) fsBtn.hidden = true;
  fsBtn.addEventListener("click", () => (isFull() ? exitFull() : enterFull()));
  const syncFsBtn = () => fsBtn.classList.toggle("on", isFull());
  document.addEventListener("fullscreenchange", syncFsBtn);
  document.addEventListener("webkitfullscreenchange", syncFsBtn);
  // pointerup (not pointerdown) counts as a user gesture for touch input.
  if (matchMedia("(pointer: coarse)").matches) {
    document.addEventListener("pointerup", enterFull, true);
  }
</script>
</body>
</html>
